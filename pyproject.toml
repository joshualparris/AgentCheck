[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwitness"
version = "0.2.1"
description = "Independent verification layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0"
]

[project.scripts]
aw = "agentwitness.cli:app"
